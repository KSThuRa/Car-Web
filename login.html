<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In — AutoVista</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="auth-page"><a class="logo auth-logo" href="index.html"><span>AV</span> AutoVista</a><main class="auth-card"><div class="auth-tabs"><button class="active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div><form id="loginForm" data-auth-form="login"><h1>Welcome back.</h1><p>Sign in to manage favorites and listings.</p><label>Email<input type="email" required></label><label>Password<input type="password" minlength="6" required></label><button class="btn btn-primary full">Sign In</button><a class="forgot" href="#">Forgot password?</a></form><form id="registerForm" data-auth-form="register" hidden><h1>Create account.</h1><p>Join AutoVista and start shopping.</p><label>Full name<input required></label><label>Email<input type="email" required></label><label>Password<input type="password" minlength="6" required></label><button class="btn btn-primary full">Create Account</button></form></main><script src="assets/js/app.js"></script></body></html>
